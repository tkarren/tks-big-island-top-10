<style>
:root { --lava:#ff4f1f; --accent:#ffb347; --aqua:#53e8ff; --ink:#fff8ea; --muted:#bed0cf; --deep:#06131a; --line:rgba(255,255,255,.14); }
* { box-sizing:border-box }
body { margin:0; font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); background:radial-gradient(circle at 10% 0%,rgba(255,79,31,.32),transparent 22rem),radial-gradient(circle at 80% 0%,rgba(83,232,255,.22),transparent 22rem),linear-gradient(145deg,#020608,#082231 55%,#100604); }
a { color:var(--aqua); text-decoration:none } a:hover { text-decoration:underline }
.shell { min-height:100vh; display:grid; grid-template-columns:380px 1fr; }
aside { padding:24px; border-right:1px solid var(--line); background:rgba(2,8,12,.72); backdrop-filter:blur(16px); overflow:auto; max-height:100vh; }
.kicker { color:var(--accent); font-weight:900; letter-spacing:.16em; text-transform:uppercase; font-size:11px; }
h1 { margin:10px 0 10px; font-size:42px; line-height:.9; letter-spacing:-.06em; background:linear-gradient(95deg,#fff6db,#ffb347,#ff4f1f,#53e8ff); -webkit-background-clip:text; background-clip:text; color:transparent; }
.lede { color:var(--muted); line-height:1.45; margin-bottom:18px; }
.nav { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 18px; }
.nav a, button { border:1px solid var(--line); background:rgba(255,255,255,.07); color:var(--ink); border-radius:999px; padding:9px 12px; cursor:pointer; font:inherit; font-size:13px; }
.nav a.active, button.active { background:linear-gradient(90deg,var(--lava),var(--accent)); color:#1b0903; font-weight:900; border-color:transparent; }
.list { display:grid; gap:9px; }
.spot { border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.055); border-radius:18px; padding:12px; cursor:pointer; }
.spot:hover { border-color:rgba(83,232,255,.5); background:rgba(83,232,255,.08); }
.spot .top { display:flex; gap:9px; align-items:flex-start; }
.badge { flex:0 0 auto; width:30px; height:30px; border-radius:999px; display:grid; place-items:center; background:linear-gradient(135deg,var(--lava),var(--accent)); color:#1b0903; font-weight:950; font-size:13px; }
.spot h2 { margin:1px 0 5px; font-size:16px; line-height:1.12; }
.meta { color:var(--accent); text-transform:uppercase; letter-spacing:.08em; font-size:10px; font-weight:900; margin-bottom:5px; }
.spot p { color:var(--muted); margin:0; font-size:13px; line-height:1.35; }
#map { min-height:100vh; background:#09202c; background-image:radial-gradient(circle at 50% 40%,rgba(83,232,255,.18),transparent 18rem); }
.marker-pin { width:30px; height:30px; border-radius:50% 50% 50% 0; background:linear-gradient(135deg,#ff4f1f,#ffb347); transform:rotate(-45deg); border:2px solid #fff8ea; box-shadow:0 8px 22px rgba(0,0,0,.4); display:grid; place-items:center; }

.popup .pro { color:#7a4b00; background:#fff3d7; padding:8px; border-radius:10px; margin:8px 0; }
.leaflet-popup-content-wrapper { border-radius:16px; }
@media(max-width:850px) { .shell { grid-template-columns:1fr; } aside { max-height:none; border-right:0; border-bottom:1px solid var(--line); } #map { min-height:72vh; } }

<script>
const spots = [{"n": 1, "title": "Hāpuna & Mauna Kea Beach", "category": "Beach Day", "region": "Kohala Coast", "desc": "Big sandy beaches on massive bays. Hāpuna is a state park; Mauna Kea has limited public parking. A coastal trail connects them.", "pro": "Take a Neso, chairs, reef-safe sunscreen, and go early for Mauna Kea parking.", "lat": 19.9913889, "lng": -155.825, "place": "Hapuna Beach State Recreation Area", "rating": 4.8, "maps_url": "https://www.google.com/maps/search/?api=1&query=Hapuna+Beach+State+Recreation+Area&query_place_id=ChIJjVntyD2HU3kR-a3WstZ_gu8"}, {"n": 2, "title": "Poke in Kawaihae — Hale Iʻa Da Fish House", "category": "Good Grindz", "region": "Kawaihae", "desc": "Fresh fish caught and prepared in-house. This is the “skip the tourist poke bowl” stop.", "pro": "Go earlier in the day for best selection.", "lat": 20.038911100000004, "lng": -155.8298404, "place": "Hale I'a Da Fish House", "rating": 4.8, "maps_url": "https://www.google.com/maps/search/?api=1&query=Hale+I%27a+Da+Fish+House&query_place_id=ChIJXa0Lf-uAU3kRYrWdUuxu8cQ"}, {"n": 3, "title": "Concrete Beach / Kawaihae Harbor", "category": "Ocean Play", "region": "Kawaihae", "desc": "Jump off the harbor piers and swim off the west side of the break. If you have an eFoil, this could be world-class riding.", "pro": "Jump only on the deep side. Don’t be dumb. The ocean charges interest.", "lat": 20.0283134, "lng": -155.8274812, "place": "South Kawaihae Small Boat Harbor", "rating": 5, "maps_url": "https://www.google.com/maps/search/?api=1&query=South+Kawaihae+Small+Boat+Harbor&query_place_id=ChIJZxSL_gaBU3kR7HKMVyDh7p0"}, {"n": 4, "title": "Pololū Valley + Food Truck + Mahukona", "category": "Adventure Loop", "region": "North Kohala", "desc": "Hike Pololū Valley, then make the mandatory stop at Fresh Off the Grid — aka Poke Nachos — before heading to Mahukona for snorkel, swim, or chair-in-the-parking-lot ocean staring.", "pro": "Poke Nachos are the move. Beware of biting donkeys. Mahukona is great on calm days: park on the concrete, break out the beach chairs, enjoy parking-lot beach vibes.", "lat": 20.2035807, "lng": -155.73384969999998, "place": "Pololū Valley Lookout", "rating": 4.8, "maps_url": "https://www.google.com/maps/search/?api=1&query=Polol%C5%AB+Valley+Lookout&query_place_id=ChIJi4omKrx7U3kRvo6rOh5slCg"}, {"n": 5, "title": "Swim & Paddle at A-Bay", "category": "Beach Day", "region": "Waikoloa", "desc": "Paddle, swim, find the secret eel spot, then hike north toward the Hilton to see dolphins. Lava Lava is great for lunch or sunset dinner.", "pro": "Best as a half-day: paddle first, Lava Lava later.", "lat": 19.9161242, "lng": -155.8932242, "place": "Anaehoomalu Bay", "rating": 4.9, "maps_url": "https://www.google.com/maps/search/?api=1&query=Anaehoomalu+Bay&query_place_id=ChIJ2UNFRJp3VHkRzEzDwhWRtkY"}, {"n": 6, "title": "Night Manta Snorkel / Dive", "category": "World Class", "region": "Kona", "desc": "A legit world-class experience: nighttime snorkel or dive with manta rays. Jack’s Diving Locker is a solid Kona option, and in recent years operators have also started running manta dives nearer Mauna Kea Beach.", "pro": "Check multiple operators for the best location that night: Mauna Kea-area options up north, or Honu Kona Divers for south/Kona options. Book ahead.", "lat": 19.6343097, "lng": -155.9889102, "place": "Jack's Diving Locker", "rating": 4.8, "maps_url": "https://www.google.com/maps/search/?api=1&query=Jack%27s+Diving+Locker&query_place_id=ChIJ3W_5bf0OVHkRX9rGOXxlL8M"}, {"n": 7, "title": "Bike Queen K to Kawaihae and Hawi", "category": "Bike", "region": "Kohala / Queen K", "desc": "Ride the back half of the Ironman course: ocean views, heat, wind, and climbs.", "pro": "Start early. Bring more hydration than you think.", "lat": 20.0382426, "lng": -155.82909519999998, "place": "Kawaihae", "rating": null, "maps_url": "https://www.google.com/maps/search/?api=1&query=Kawaihae&query_place_id=ChIJ2WeeRuqAU3kRzHGYEqTezJY"}, {"n": 8, "title": "Bike to Waikoloa Village and Beyond", "category": "Bike", "region": "Waikoloa", "desc": "Climb from the coast toward Waikoloa Village and keep going as far and high as your legs allow. Big views of four mountains and Maui.", "pro": "Great training ride. Wind can turn “fun” into “character-building.”", "lat": 19.937248399999998, "lng": -155.7910681, "place": "Waikoloa Village", "rating": null, "maps_url": "https://www.google.com/maps/search/?api=1&query=Waikoloa+Village&query_place_id=ChIJrcU3uNyHU3kROiwYHoDF6Mw"}, {"n": 9, "title": "Swim the Ironman Course in Kona Town", "category": "Swim / Snorkel", "region": "Kailua-Kona", "desc": "The Kona harbor is some of the clearest water around: bait balls, reef fish, and the classic Ironman swim line.", "pro": "Bonus points if you fish afterward. You can snorkel here too.", "lat": 19.6393742, "lng": -155.9969544, "place": "Kailua Pier", "rating": 4.6, "maps_url": "https://www.google.com/maps/search/?api=1&query=Kailua+Pier&query_place_id=ChIJDcQoN_8OVHkRtcepbRwMGi0"}, {"n": 10, "title": "Two Step + Picnic + Hoʻokena", "category": "Snorkel", "region": "South Kona", "desc": "Two Step is a fish tank. Picnic behind the parking lot at the national park, then tag on Hoʻokena for black sand beach time.", "pro": "Respect the entry/exit and surge at Two Step.", "lat": 19.4232986, "lng": -155.9113179, "place": "Honaunau Bay", "rating": 4.7, "maps_url": "https://www.google.com/maps/search/?api=1&query=Honaunau+Bay&query_place_id=ChIJz8neTLgBVHkRUZOs1UDHQi0"}, {"n": 11, "title": "Mauna Kea Lookout at Sunset", "category": "Sunset", "region": "Mauna Kea", "desc": "Drive up, hike over, and watch the sun drop from way up high.", "pro": "Bring warm clothes. It is not beach weather up there, captain obvious.", "lat": 19.7592729, "lng": -155.4561238, "place": "Maunakea Visitor Information Station", "rating": 4.6, "maps_url": "https://www.google.com/maps/search/?api=1&query=Maunakea+Visitor+Information+Station&query_place_id=ChIJK4b_bAC_U3kR0eAjVpvOkJU"}, {"n": 12, "title": "Rent a Boat / Fish / Snorkel / Whales / Dolphins", "category": "On the Water", "region": "Kona Coast", "desc": "Rent a boat or charter for fishing, snorkeling, whale watching, and dolphin watching.", "pro": "Ask Tom for details. Local knowledge matters here.", "lat": 19.671944399999997, "lng": -156.0269444, "place": "Honokohau Small Boat Harbor", "rating": 4.5, "maps_url": "https://www.google.com/maps/search/?api=1&query=Honokohau+Small+Boat+Harbor&query_place_id=ChIJe9FcdRIOVHkRM3VTwwvrW8w"}, {"n": 13, "title": "Captain Cook Snorkel or Kayak", "category": "Snorkel", "region": "Kealakekua Bay", "desc": "Classic Big Island snorkel/kayak mission with clear water and a big payoff.", "pro": "Kayak with the right permit/operator, or go by boat.", "lat": 19.4813011, "lng": -155.9334285, "place": "Captain James Cook Monument", "rating": 4.6, "maps_url": "https://www.google.com/maps/search/?api=1&query=Captain+James+Cook+Monument&query_place_id=ChIJC3psrUgBVHkRpxKx4sl0lAk"}, {"n": 14, "title": "Volcano", "category": "Volcano", "region": "Hawaiʻi Volcanoes", "desc": "Watch USGS and YouTube channels for eruption episodes. When it looks like it’s going blast-o, go — even middle of da night.", "pro": "Check eruption status before driving. Conditions change fast.", "lat": 19.496366899999998, "lng": -155.4661859, "place": "Hawaiʻi Volcanoes National Park", "rating": 4.8, "maps_url": "https://www.google.com/maps/search/?api=1&query=Hawai%CA%BBi+Volcanoes+National+Park&query_place_id=ChIJscm5wLZhUXkRJq6EPCZ7Wz4"}, {"n": 15, "title": "Obisic Shave Ice", "category": "Sweet Treat", "region": "Kona", "desc": "Real-fruit shave ice creations with fun toppings and mac nut ice cream in the middle.", "pro": "Reported hours: 11:30 AM–6:30 PM. Verify before driving.", "lat": 19.9161665, "lng": -155.8819303, "place": "Original Big Island Shave Ice Co.", "rating": 4.6, "maps_url": "https://www.google.com/maps/search/?api=1&query=Original+Big+Island+Shave+Ice+Co.&query_place_id=ChIJAV4PiZt3VHkRSQmdGPrkLb0"}, {"n": 16, "title": "South Kona Grindz", "category": "Good Grindz", "region": "South Kona", "desc": "Fish and chips, grilled ono, and proper local plate energy.", "pro": "The grilled ono is da bomb.", "lat": 19.4469454, "lng": -155.8800178, "place": "South Kona Grindz", "rating": 4.6, "maps_url": "https://www.google.com/maps/search/?api=1&query=South+Kona+Grindz&query_place_id=ChIJeReMU_MAVHkRBi-TbTCHbhA"}, {"n": 17, "title": "Cafe Pesto — Hilo", "category": "Restaurant", "region": "Hilo", "desc": "A reliable Hilo food stop when you’re on the east side.", "pro": "Good anchor meal for a Hilo / Volcano day.", "lat": 19.723734999999998, "lng": -155.08501479999998, "place": "Cafe Pesto Hilo Bay", "rating": 4.5, "maps_url": "https://www.google.com/maps/search/?api=1&query=Cafe+Pesto+Hilo+Bay&query_place_id=ChIJ1fgg61dLUnkRfeJrovG6W8M"}, {"n": 18, "title": "Lava Lava Beach Club", "category": "Sunset Dinner", "region": "Waikoloa", "desc": "Lunch, dinner, sunset, drinks, dessert, beach hangout — all in one place.", "pro": "Virgin lava flow y’all. Go late and linger.", "lat": 19.913297699999998, "lng": -155.8879458, "place": "Lava Lava Beach Club", "rating": 4.4, "maps_url": "https://www.google.com/maps/search/?api=1&query=Lava+Lava+Beach+Club&query_place_id=ChIJLV0YzpZ3VHkRrJxydNU8n4s"}, {"n": 19, "title": "Dog Beach / Kohanaiki", "category": "Snorkel", "region": "Kona", "desc": "Snorkel at Dog Beach — but yes, beware the huge shark. Tom takes a poking stick or spear gun, for reals.", "pro": "Only for confident ocean people. Don’t solo it.", "lat": 19.6986536, "lng": -156.0466314, "place": "Kohanaiki Beach Park", "rating": 4.7, "maps_url": "https://www.google.com/maps/search/?api=1&query=Kohanaiki+Beach+Park&query_place_id=ChIJ4-C3Q-wNVHkRt3W0N-83awo"}, {"n": 20, "title": "Hoʻokena Beach", "category": "Beach", "region": "South Kona", "desc": "Black sand beach with a more local feel and a good add-on to South Kona days.", "pro": "Check ocean conditions; entries vary.", "lat": 19.3798649, "lng": -155.8974978, "place": "Ho‘okena Beach Park", "rating": 4.7, "maps_url": "https://www.google.com/maps/search/?api=1&query=Ho%E2%80%98okena+Beach+Park&query_place_id=ChIJvVuviouqVnkRGLko16_1cNc"}, {"n": 21, "title": "Balsimo’s Pizza + Smash Daddy’s 808", "category": "Good Grindz", "region": "Waikoloa", "desc": "Pizza and burgers in Waikoloa — easy crowd-pleasers after beach or bike time.", "pro": "Useful when nobody wants to “decide where to eat.”", "lat": 19.924589599999997, "lng": -155.7896879, "place": "Balsimo's Pizza", "rating": 4.8, "maps_url": "https://www.google.com/maps/search/?api=1&query=Balsimo%27s+Pizza&query_place_id=ChIJbU7eBgCHU3kRJWIxN0n2Q-U"}, {"n": 22, "title": "Tropical Dreams Mac Nut Ice Cream", "category": "Sweet Treat", "region": "Big Island", "desc": "Find Tropical Dreams mac nut ice cream. Good grindz.", "pro": "Look for it at local markets and shops.", "lat": 20.0094195, "lng": -155.67937759999998, "place": "Tropical Dreams Ice Cream", "rating": 5, "maps_url": "https://www.google.com/maps/search/?api=1&query=Tropical+Dreams+Ice+Cream&query_place_id=ChIJ0xNQAgCDU3kRAg7Miqxp_hM"}, {"n": 23, "title": "Matsuyama Food & Fuel", "category": "Local Stop", "region": "Kona", "desc": "Food, gas, musubi — the practical local stop that earns its spot.", "pro": "Grab musubi before heading south or north.", "lat": 19.725924199999998, "lng": -156.0327194, "place": "Matsuyama food and fuel", "rating": 4.5, "maps_url": "https://www.google.com/maps/search/?api=1&query=Matsuyama+food+and+fuel&query_place_id=ChIJl01J_3QNVHkR7WR8F0jSV4A"}, {"n": 24, "title": "King’s Shops & Queen’s Marketplace", "category": "Shopping / Easy Stop", "region": "Waikoloa", "desc": "Low-effort Waikoloa shopping stop: buy T-shirts, Crocs, beach stuff, souvenirs — whatever floats your canoe.", "pro": "Good filler stop before dinner, after A-Bay, or when the group needs shade and bathrooms.", "lat": 19.9163493, "lng": -155.8827389, "place": "Kings' Shops", "rating": 4.2, "maps_url": "https://www.google.com/maps/search/?api=1&query=Kings%27+Shops&query_place_id=ChIJiXTY-pJ3VHkRC50mjs8WvbI"}, {"n": 25, "title": "Tommy Bahama Restaurant at Mauna Lani", "category": "Restaurant", "region": "Mauna Lani", "desc": "Polished island dinner/lunch spot at the Mauna Lani shops. Good food, easy atmosphere, and reliable for visitors who want nice without going full resort formal.", "pro": "Make a reservation for dinner; pair it with a Mauna Lani sunset walk if you’re feeling fancy.", "lat": 19.941679, "lng": -155.85857590000003, "place": "Tommy Bahama Restaurant & Bar", "rating": 4.5, "maps_url": "https://www.google.com/maps/search/?api=1&query=Tommy+Bahama+Restaurant+%26+Bar&query_place_id=ChIJCzNDd3-CU3kRIQe3nUGOtAs"}, {"n": 26, "title": "Pine Trees / Nēnē Beach + Pine Tree Cafe", "category": "Beach Day", "region": "Kona", "desc": "We call it Nēnē Beach. A classic Kona beach/surf hang with lava-rock shoreline, sand pockets, and a more local feel than the resort beaches.", "pro": "Hit Pine Tree Cafe before or after. Plate lunch plus beach time is undefeated island math.", "lat": 19.6947132, "lng": -156.0447115, "place": "Pine Trees Surfing Beach", "rating": 4.6, "maps_url": "https://www.google.com/maps/search/?api=1&query=Pine+Trees+Surfing+Beach&query_place_id=ChIJSRrRQvgNVHkRc8fB4B8bOkA"}, {"n": 27, "title": "Holoholokai Beach Park", "category": "Beach Day", "region": "Mauna Lani / Puakō", "desc": "An amazing spot to park a chair in some shade, wander the trails toward Puakō, or just settle in and watch the sunset.", "pro": "Check-em-out-ya? Bring a chair, something cold, and enough time to do absolutely nothing on purpose.", "lat": 19.9557303, "lng": -155.8601594, "place": "Holoholokai Beach Park", "rating": 4.7, "maps_url": "https://www.google.com/maps/search/?api=1&query=Holoholokai+Beach+Park&query_place_id=ChIJ1VJj8XZ4VHkRC44nQ4L0Xh0"}, {"n": 28, "title": "Kohala Divers", "category": "Dive / Snorkel Shop", "region": "Kawaihae / North Island", "desc": "Great dive/snorkel shop for north island adventures. Good stop when you’re aiming at Kawaihae, Mahukona, Kohala coast dives, or need gear/advice before getting wet.", "pro": "Ask them about north island conditions and charters. Just don’t ask them about harvesting lobsters haha.", "lat": 20.039836899999997, "lng": -155.8305138, "place": "Kohala Divers", "rating": 4.9, "maps_url": "https://www.google.com/maps/search/?api=1&query=Kohala+Divers&query_place_id=ChIJ92TqfeuAU3kRHyGl-ZvghRw"}, {"n": 29, "title": "Gill’s Lanai", "category": "Relaxing Grindz", "region": "North Kohala / Kapaʻau", "desc": "Gill’s is relaxing vibes: a mellow North Kohala food stop when you want to slow down, sit outside, and let the day breathe a little.", "pro": "Great add-on when you’re already up north for Pololū, Hawi, or Mahukona.", "lat": 20.2305207, "lng": -155.8007722, "place": "Gill's Lanai", "rating": 4.9, "maps_url": "https://www.google.com/maps/search/?api=1&query=Gill%27s+Lanai&query_place_id=ChIJa4mRmfh8U3kRzo2e5D8hmag"}, {"n": 30, "title": "Willie’s Hot Chicken", "category": "Good Grindz", "region": "Kona", "desc": "Hot chicken in Kona with the proper slogan: giving you the bird. Casual, spicy, satisfying, and a good mainland-craving fix after too much responsible beach behavior.", "pro": "Choose your heat level wisely. Pride is not a sauce.", "lat": 19.6440657, "lng": -155.9985295, "place": "Willie's Hot Chicken", "rating": 4.4, "maps_url": "https://www.google.com/maps/search/?api=1&query=Willie%27s+Hot+Chicken&query_place_id=ChIJfYq9hNYPVHkRPBWiblxh87M"}, {"n": 31, "title": "Hilton Waikoloa Village", "category": "Resort Stop", "region": "Waikoloa", "desc": "Huge resort stop with a super pool setup, an amazing lagoon, and Hawaii Dolphin Quest. It’s worth wandering through even if you’re not staying there.", "pro": "Pools are for registered guests only, but you can park and walk in to see the dolphins and spots.forEach(s => {
  bounds.push([s.lat,s.lng]);
  const popup = `<div class="popup"><h3>${s.n}. ${s.title}</h3><p>${s.desc}</p><div class="pro"><strong>TK pro tip:</strong> ${s.pro}</div><p><a href="${s.maps_url}" target="_blank" rel="noopener">Open in Google Maps${s.rating ? ' · ★ '+s.rating : ''}</a></p></div>`;
  const m=L.marker([s.lat,s.lng], { icon: icon(s.n) }).addTo(map).bindPopup(popup);
  markers[s.n]=m;
  const el=document.createElement('div'); el.className='spot';
  el.innerHTML=`<div class="top"><div class="badge">${s.n}</div><div><div class="meta">${s.category} · ${s.region}</div><h2>${s.title}</h2><p>${s.place || ''}${s.rating ? ' · ★ '+s.rating : ''}</p></div></div>`;
  el.onclick=()=>{ map.setView([s.lat,s.lng], 13); m.openPopup(); };
  list.appendChild(el);
});
function fit() { if(bounds.length) map.fitBounds(bounds, { padding:[35,35] }); }
document.getElementById('fit').onclick=fit;
fit();
</script>
</body>
</html>
